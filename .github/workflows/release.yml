name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-15-intel, target: x86_64-apple-darwin, ext: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -e
          dir="pycompile-${{ matrix.target }}"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/pycompile" "$dir/"
          cp "target/${{ matrix.target }}/release/python_compiler" "$dir/"
          cp LICENSE README.md docs/pycompile.1 "$dir/"
          tar -czf "pycompile-${{ matrix.target }}.tar.gz" "$dir"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "pycompile-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/pycompile.exe" $dir
          Copy-Item "target/${{ matrix.target }}/release/python_compiler.exe" $dir
          Copy-Item LICENSE, README.md, docs/pycompile.1 $dir
          Compress-Archive -Path $dir -DestinationPath "pycompile-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.target }}
          path: pycompile-${{ matrix.target }}.${{ matrix.ext }}
          if-no-files-found: error

      - name: Install packaging tools
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Build .deb and .rpm
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkg
          cargo deb --target ${{ matrix.target }} -o pkg/
          cargo generate-rpm --target ${{ matrix.target }} -o pkg/

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: pkg-linux-${{ matrix.target }}
          path: pkg/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f \( -name 'pycompile-*' -o -name 'pycompile_*' \) -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: pycompile ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/pycompile-*.tar.gz
            dist/pycompile-*.zip
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          body: |
            Native binaries for **pycompile** (also installed as `python_compiler`).

            Extract the archive for your platform, put both binaries on your `PATH`, then:

            ```
            pycompile --version
            pycompile man
            sudo pycompile man --install   # optional, installs man pycompile
            ```

            Install via a package manager instead:

            ```
            sudo apt install ./pycompile_*.deb      # Debian / Ubuntu
            sudo dnf install ./pycompile-*.rpm      # Fedora / RHEL
            ```

            Verify downloads against `SHA256SUMS`. See the [repository](https://github.com/ramackersjp/pycompile) and `pycompile man` for the full manual.
