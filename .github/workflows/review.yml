name: review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  opencode-review:
    name: OpenCode pull request review
    # Only review pull requests from the same repository so that secrets are
    # never exposed to untrusted fork code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: anthropic/claude-sonnet-4-20250514
          use_github_token: true
          prompt: |
            Review this pull request for the pycompile project (a Rust ahead-of-time
            Python-to-C compiler with an embedded C runtime).

            Check for:
            - Bugs and correctness issues, especially in the lexer, parser, codegen and C runtime
            - Memory-safety problems in the generated C and in runtime/pyrt.c
            - Clear compile-time error messages for unsupported constructs
            - Code quality, naming and consistency with the existing code style
            - Missing or incorrect tests, docs, or examples

            Constraints:
            - All repository content (code, comments, docs, commit messages) must be English
            - Do not modify files; only report findings
            - Categorise each finding as [BUG], [IMPROVEMENT], [BEST PRACTICE] or [SECURITY]
            - Include severity ([LOW], [MEDIUM], [HIGH]) and reference specific files/lines
            - If there are no issues, say so briefly
